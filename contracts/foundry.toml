[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Nox + ERC-7984
remappings = [
  "@iexec-nox/nox-protocol-contracts/=lib/nox-protocol-contracts/",
  "@iexec-nox/nox-confidential-contracts/=lib/nox-confidential-contracts/",
  "encrypted-types/=lib/encrypted-types/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}"

[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
